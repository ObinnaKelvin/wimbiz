    <script>
      // Gracefully handle iframe HMR WebSocket notices according to environment constraint ("HMR: Disabled. Ignore WebSocket errors.")
      (function() {
        // 1. Mock Vite HMR WebSocket so client connects cleanly without throwing or failing
        if (typeof window !== 'undefined' && typeof window.WebSocket !== 'undefined') {
          var RealWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var isHmr = false;
            try {
              if (typeof url === 'string' && (url.indexOf('vite') !== -1 || url.indexOf('token=') !== -1 || url.indexOf(':5173') !== -1 || url.indexOf(':3000') !== -1)) isHmr = true;
              if (protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1)) isHmr = true;
            } catch (e) {}

            if (isHmr) {
              var listeners = {};
              var mock = {
                url: url,
                protocol: 'vite-hmr',
                readyState: 1, // OPEN
                send: function() {},
                close: function() {
                  mock.readyState = 3;
                  if (typeof mock.onclose === 'function') mock.onclose({ code: 1000, reason: 'Normal Closure', wasClean: true });
                  (listeners['close'] || []).forEach(function(fn) { fn({ code: 1000, reason: 'Normal Closure', wasClean: true }); });
                },
                addEventListener: function(evt, fn) {
                  listeners[evt] = listeners[evt] || [];
                  listeners[evt].push(fn);
                },
                removeEventListener: function(evt, fn) {
                  if (listeners[evt]) listeners[evt] = listeners[evt].filter(function(f) { return f !== fn; });
                },
                dispatchEvent: function() { return true; },
                onopen: null,
                onmessage: null,
                onerror: null,
                onclose: null,
              };
              setTimeout(function() {
                if (typeof mock.onopen === 'function') mock.onopen(new Event('open'));
                (listeners['open'] || []).forEach(function(fn) { fn(new Event('open')); });
              }, 5);
              return mock;
            }
            return new RealWebSocket(url, protocols);
          };
          window.WebSocket.prototype = RealWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // 2. Filter all console methods for Vite HMR notices
        ['log', 'warn', 'error', 'info', 'debug'].forEach(function(method) {
          var orig = console[method];
          if (!orig) return;
          console[method] = function() {
            for (var i = 0; i < arguments.length; i++) {
              var arg = arguments[i];
              var str = '';
              try {
                if (typeof arg === 'string') {
                  str = arg;
                } else if (arg && typeof arg === 'object') {
                  str = (arg.message || '') + ' ' + (arg.stack || '') + ' ' + String(arg);
                } else {
                  str = String(arg);
                }
              } catch (e) {}
              if (
                str.indexOf('[vite]') !== -1 ||
                str.indexOf('vite-hmr') !== -1 ||
                str.indexOf('WebSocket') !== -1 ||
                str.indexOf('ws://') !== -1 ||
                str.indexOf('wss://') !== -1
              ) {
                return;
              }
            }
            return orig.apply(console, arguments);
          };
        });

        // 3. Suppress any unhandled rejections / error events relating to Vite or WebSockets
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = '';
          try {
            msg = typeof reason === 'string' ? reason : (reason && (reason.message || String(reason))) || '';
          } catch (e) {}
          if (
            msg.indexOf('[vite]') !== -1 ||
            msg.indexOf('vite-hmr') !== -1 ||
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('ws://') !== -1 ||
            msg.indexOf('wss://') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });

        window.addEventListener('error', function(event) {
          var msg = event.message || '';
          if (
            msg.indexOf('[vite]') !== -1 ||
            msg.indexOf('vite-hmr') !== -1 ||
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('ws://') !== -1 ||
            msg.indexOf('wss://') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
      })();
    </script>
